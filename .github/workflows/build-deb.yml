name: build-deb

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - name: apt update && upgrade
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get upgrade -y
      - name: Build
        run: |
          mkdir -p dist
          cd dist
          ../deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: krun-chielo
          path: dist/krun-chielo_*.deb
          if-no-files-found: error
      - name: Push to Fury
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
        run: |
          set -euo pipefail
          deb=$(ls dist/krun-chielo_*.deb)
          if [[ -z "${FURY_TOKEN:-}" ]]; then
            echo "FURY_TOKEN not set, skip push"
            exit 0
          fi
          curl -F "package=@${deb}" "https://${FURY_TOKEN}@push.fury.io/chielo/"

  renovate:
    name: Renovate auto-merge
    if: github.actor == 'renovate[bot]' && github.event_name == 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - name: Approve and merge
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
